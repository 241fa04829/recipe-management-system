          };

        // Parse instructions lines
        const parsedInstructions = instructionsText.split('\n').filter(Boolean);

        const newDish = {
          id: `rec_${Date.now()}`,
          title,
          category,
          cuisine,
          price: parseFloat(price) || 14.99,
          image: image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80',
          description,
          prepTime,
          cookTime: '25 mins',
          servings: 2,
          difficulty: 'Medium',
          dietary: ['Vegetarian'],
          rating: 5.0,
          reviewsCount: 1,
          isAvailable: true,
          isFeatured: true,
          ingredients: parsedIngredients,
          instructions: parsedInstructions,
          nutrition: { calories: 480, protein: '12g', carbs: '55g', fat: '14g', fiber: '4g' },
          chefNotes: 'Serve fresh and hot right from the skillet!'
        };

        onAdd(newDish);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
          <div className="bg-white rounded-3xl max-w-xl w-full overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
            <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
              <h3 className="font-bold text-base">Add New Recipe to Catalog</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold block mb-1">Recipe / Food Title</label>
                  <input type="text" required value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Handmade Fettuccine Alfredo" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="text-xs font-semibold block mb-1">Category</label>
                  <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
                    <option value="Italian">Italian</option>
                    <option value="Indian">Indian</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Asian">Asian</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Healthy">Healthy</option>
                    <option value="Fast Food">Fast Food</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold block mb-1">Price ($ USD)</label>
                  <input type="number" step="0.01" required value={price} onChange={e => setPrice(e.target.value)} placeholder="16.99" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label className="text-xs font-semibold block mb-1">Prep Time</label>
                  <input type="text" value={prepTime} onChange={e => setPrepTime(e.target.value)} placeholder="20 mins" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold block mb-1">Food Image URL</label>
                <input type="url" value={image} onChange={e => setImage(e.target.value)} placeholder="https://images.unsplash.com/..." className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
              </div>

              <div>
                <label className="text-xs font-semibold block mb-1">Appetizing Description</label>
                <textarea rows="2" required value={description} onChange={e => setDescription(e.target.value)} placeholder="Write description of taste, texture, and appeal..." className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></textarea>
              </div>

              <div>
                <label className="text-xs font-semibold block mb-1">List of Ingredients (One per line: Name - Qty)</label>
                <textarea rows="3" required value={ingredientsText} onChange={e => setIngredientsText(e.target.value)} placeholder="Arborio Rice - 1.5 cups&#10;Parmigiano-Reggiano - 1/2 cup" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-mono"></textarea>
              </div>

              <div>
                <label className="text-xs font-semibold block mb-1">Cooking Instructions (One step per line)</label>
                <textarea rows="3" required value={instructionsText} onChange={e => setInstructionsText(e.target.value)} placeholder="Step 1: Toast rice.&#10;Step 2: Add broth slowly." className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-mono"></textarea>
              </div>

              <button type="submit" className="w-full py-3 bg-brand-600 text-white font-bold rounded-xl text-xs hover:bg-brand-700">
                Save & Publish Recipe
              </button>
            </form>
          </div>
        </div>
      );
    }
